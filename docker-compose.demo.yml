# ArtemisApp — Docker demo productivo
# Uso recomendado: ./scripts/docker-demo-up.sh
#
# Dominio API: api.artemis.init.com.mx | Front (Vercel): artemis.init.com.mx
# (ver .env.docker)
# Puertos: se autoasignan si el preferido está ocupado (scripts/resolve-docker-ports.py)

name: artemis-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis_demo
      POSTGRES_DB: artemis
    volumes:
      - demodb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Sin puerto publicado — solo red interna (no pelea con Postgres local)

  app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: artemis.settings.demo
      DATABASE_URL: postgres://artemis:artemis_demo@db:5432/artemis
      SECRET_KEY: ${SECRET_KEY:-demo-secret-cambiar-en-produccion-real}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api.artemis.init.com.mx,app}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,https://api.artemis.init.com.mx,https://artemis.init.com.mx}
      HOST: ${ARTEMIS_PUBLIC_URL:-https://api.artemis.init.com.mx}
      ARTEMIS_DOMAIN: ${ARTEMIS_DOMAIN:-api.artemis.init.com.mx}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://artemis.init.com.mx}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://artemis.init.com.mx}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-None}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@artemis.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo123}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@artemis.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      ADMIN_ENVIRONMENT_LABEL: Demo
      GUNICORN_WORKERS: "2"
      USE_X_FORWARDED_HOST: "true"
    volumes:
      - demomedia:/home/user/app/backend/mediafiles
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "${ARTEMIS_HTTP_PORT:-18080}:80"
    environment:
      ARTEMIS_DOMAIN: ${ARTEMIS_DOMAIN:-api.artemis.init.com.mx}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  demodb:
  demomedia:
  caddy_data:
  caddy_config:
