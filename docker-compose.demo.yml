# ArtemisApp — Docker demo productivo
# Uso: docker compose -f docker-compose.demo.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis_demo
      POSTGRES_DB: artemis
    volumes:
      - demodb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports:
      - "8080:8000"
    environment:
      DJANGO_SETTINGS_MODULE: artemis.settings.demo
      DATABASE_URL: postgres://artemis:artemis_demo@db:5432/artemis
      SECRET_KEY: demo-secret-cambiar-en-produccion-real
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      HOST: http://localhost:8080
      DEMO_USER_EMAIL: demo@artemis.local
      DEMO_USER_PASSWORD: demo123
      DEMO_ADMIN_EMAIL: admin@artemis.local
      DEMO_ADMIN_PASSWORD: admin123
      ADMIN_ENVIRONMENT_LABEL: Demo
      GUNICORN_WORKERS: "2"
    volumes:
      - demomedia:/home/user/app/backend/mediafiles
    depends_on:
      db:
        condition: service_healthy

volumes:
  demodb:
  demomedia:
