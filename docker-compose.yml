# ArtemisApp — desarrollo local
# Uso recomendado: ./scripts/docker-dev-up.sh
# Puertos configurables en .env.docker (defaults altos para evitar conflictos)

name: artemis-dev

services:
  db:
    image: "postgres:alpine"
    environment:
      - POSTGRES_USER=artemis
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=artemis
    ports:
      - "${ARTEMIS_DEV_DB_PORT:-15432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data:delegated

  broker:
    image: "rabbitmq:alpine"

  result:
    image: "redis:alpine"
    ports:
      - "${ARTEMIS_DEV_REDIS_PORT:-16379}:6379"

  frontend:
    build:
      dockerfile: frontend/Dockerfile
      context: .
    volumes:
      - .:/app/
      - /app/node_modules
    ports:
      - "${ARTEMIS_DEV_FRONTEND_PORT:-13000}:3000"

  backend:
    build:
      dockerfile: backend/Dockerfile
      context: .
    ports:
      - "${ARTEMIS_DEV_BACKEND_PORT:-18000}:8000"
    volumes:
      - ./:/home/user/app/
    env_file: backend/.env
    depends_on:
      - db
      - broker
      - result
      - frontend

  celery:
    build:
      dockerfile: backend/Dockerfile
      context: .
    command: celery --app=artemis worker --loglevel=info
    volumes:
      - ./:/home/user/app/
    env_file: backend/.env
    depends_on:
      - db
      - broker
      - result

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${ARTEMIS_DEV_MAILHOG_SMTP_PORT:-11025}:1025"
      - "${ARTEMIS_DEV_MAILHOG_UI_PORT:-18025}:8025"

volumes:
  dbdata:
