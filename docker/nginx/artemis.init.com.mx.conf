# Reverse proxy para ArtemisApp demo (Caddy en 127.0.0.1:18080)
# Instalar:
#   sudo cp docker/nginx/artemis.init.com.mx.conf /etc/nginx/sites-available/artemis.init.com.mx
#   sudo ln -sf /etc/nginx/sites-available/artemis.init.com.mx /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d artemis.init.com.mx

upstream artemis {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    server_name artemis.init.com.mx;

    client_max_body_size 50M;

    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/artemis.access.log;
    error_log /var/log/nginx/artemis.error.log;

    location / {
        proxy_pass http://artemis;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
